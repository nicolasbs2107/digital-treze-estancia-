<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Painel — Estância Treze Pizzaria</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#3A060F">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
    <style>
        /* =====================================================================
   PAINEL ADMINISTRATIVO — ESTÂNCIA TREZE PIZZARIA
   Mesma paleta do site público, em layout de painel.
   ===================================================================== */

        :root {
            --tinta: #1E1512;
            --tinta-2: #6B574E;
            --tinta-3: #9A857A;
            --fundo: #F7F2EA;
            --superficie: #FFFFFF;
            --superficie-2: #F3EADC;
            --linha: #E6D8C5;
            --linha-forte: #D4C0A6;
            --vinho: #6B1220;
            --vinho-fundo: #3A060F;
            --brasa: #C43A1E;
            --dourado: #C98B2E;
            --ok: #2D7A4B;
            --ok-suave: #E7F3EB;
            --alerta: #96591A;
            --erro: #B3261E;
            --erro-suave: #FBEAE8;
            --sombra-1: 0 1px 2px rgba(58, 6, 15, .05), 0 4px 14px rgba(58, 6, 15, .05);
            --sombra-2: 0 10px 34px rgba(58, 6, 15, .16);
            --raio: 14px;
            --display: "Fraunces", Georgia, serif;
            --texto: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --tinta: #F5EBE0;
                --tinta-2: #BCA99C;
                --tinta-3: #937F72;
                --fundo: #141010;
                --superficie: #1D1817;
                --superficie-2: #272020;
                --linha: #342A27;
                --linha-forte: #493B36;
                --vinho: #8A1A2B;
                --brasa: #E4603F;
                --dourado: #E0AC55;
                --ok: #54B67D;
                --ok-suave: #16281D;
                --alerta: #D89A4A;
                --erro: #E4776B;
                --erro-suave: #2E1614;
                --sombra-1: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .3);
                --sombra-2: 0 10px 34px rgba(0, 0, 0, .55);
            }
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--fundo);
            color: var(--tinta);
            font-family: var(--texto);
            font-size: 15px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        body.trava {
            overflow: hidden;
        }

        h1,
        h2,
        h3 {
            margin: 0;
            letter-spacing: -.02em;
        }

        p {
            margin: 0;
        }

        button {
            font: inherit;
            color: inherit;
            border: 0;
            background: none;
            cursor: pointer;
        }

        input,
        select,
        textarea {
            font: inherit;
            font-size: 16px;
            color: inherit;
        }

        img {
            max-width: 100%;
            display: block;
        }

        :focus-visible {
            outline: 2px solid var(--brasa);
            outline-offset: 2px;
            border-radius: 8px;
        }

        [hidden] {
            display: none !important;
        }

        .dinheiro {
            font-variant-numeric: tabular-nums;
        }

        /* ---------- botões ---------- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 11px 18px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 14.5px;
            letter-spacing: -.01em;
            transition: background-color .16s ease, transform .14s ease, opacity .16s ease;
            white-space: nowrap;
        }

        .btn:active {
            transform: scale(.98);
        }

        .btn-principal {
            background: var(--brasa);
            color: #FFF6EA;
        }

        .btn-secundario {
            background: var(--superficie-2);
            color: var(--tinta);
        }

        .btn-fantasma {
            border: 1px solid var(--linha-forte);
            color: var(--tinta-2);
        }

        .btn-perigo {
            background: var(--erro);
            color: #fff;
        }

        .btn-bloco {
            width: 100%;
        }

        .btn[disabled] {
            opacity: .55;
            cursor: not-allowed;
        }

        .btn.carregando {
            position: relative;
            color: transparent !important;
        }

        .btn.carregando::after {
            content: "";
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, .45);
            border-top-color: #fff;
            animation: girar .7s linear infinite;
        }

        .btn-fantasma.carregando::after,
        .btn-secundario.carregando::after {
            border-color: var(--linha-forte);
            border-top-color: var(--tinta);
        }

        @keyframes girar {
            to {
                transform: rotate(360deg);
            }
        }

        @media (hover:hover) {
            .btn-principal:hover:not([disabled]) {
                background: #A92F16;
            }

            .btn-secundario:hover:not([disabled]) {
                background: var(--linha);
            }

            .btn-fantasma:hover:not([disabled]) {
                background: var(--superficie-2);
            }
        }

        /* ---------- telas centrais (carregando e login) ---------- */
        .tela-centro {
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 24px 18px;
            background:
                radial-gradient(90% 70% at 50% 0%, rgba(107, 18, 32, .12) 0%, rgba(107, 18, 32, 0) 60%),
                var(--fundo);
        }

        .girando {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 3px solid var(--linha);
            border-top-color: var(--brasa);
            animation: girar .8s linear infinite;
            margin-bottom: 12px;
        }

        #tela-carregando p {
            color: var(--tinta-3);
            font-size: 14px;
            text-align: center;
        }

        #tela-carregando {
            grid-auto-flow: row;
            align-content: center;
            justify-items: center;
        }

        .selo-marca {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: linear-gradient(160deg, #E8B45C, #C98B2E);
            color: #3A060F;
            font-family: var(--display);
            font-weight: 700;
            font-size: 19px;
            box-shadow: inset 0 0 0 2px rgba(58, 6, 15, .22);
        }

        .selo-marca.pequeno {
            width: 38px;
            height: 38px;
            font-size: 15px;
        }

        .cartao-login {
            width: 100%;
            max-width: 394px;
            background: var(--superficie);
            border: 1px solid var(--linha);
            border-radius: 20px;
            padding: 30px 26px 24px;
            box-shadow: var(--sombra-2);
            display: grid;
            gap: 4px;
            justify-items: stretch;
        }

        .cartao-login .selo-marca {
            justify-self: center;
        }

        .cartao-login h1 {
            margin-top: 14px;
            text-align: center;
            font-family: var(--display);
            font-size: 27px;
            font-weight: 600;
        }

        .cartao-login .sub {
            text-align: center;
            color: var(--tinta-3);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .campo {
            margin-top: 12px;
        }

        .campo>label {
            display: block;
            margin-bottom: 6px;
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: var(--tinta-3);
        }

        .entrada,
        .campo input,
        .campo select,
        .campo textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--linha);
            border-radius: 11px;
            background: var(--fundo);
            outline: none;
            transition: border-color .15s ease;
        }

        .campo textarea {
            min-height: 80px;
            resize: vertical;
        }

        .campo input:focus,
        .campo select:focus,
        .campo textarea:focus,
        .entrada:focus {
            border-color: var(--brasa);
        }

        .campo input.invalido {
            border-color: var(--erro);
            background: var(--erro-suave);
        }

        .campo-senha {
            position: relative;
        }

        .campo-senha input {
            padding-right: 88px;
        }

        .olho {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            padding: 7px 11px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            color: var(--brasa);
        }

        .erro-login {
            margin-top: 12px;
            padding: 10px 13px;
            background: var(--erro-suave);
            color: var(--erro);
            border-radius: 10px;
            font-size: 13.5px;
        }

        #form-login .btn {
            margin-top: 18px;
        }

        .rodape-login {
            margin-top: 14px;
            text-align: center;
            font-size: 12px;
            color: var(--tinta-3);
        }

        /* ---------- topo ---------- */
        .topo-admin {
            position: sticky;
            top: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 11px 16px;
            background: linear-gradient(150deg, #6B1220, #3A060F);
            color: #F6E8DA;
        }

        .topo-admin .marca {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .marca-texto {
            display: grid;
            min-width: 0;
        }

        .marca-texto strong {
            font-family: var(--display);
            font-size: 17px;
            font-weight: 600;
            color: #FFF6EA;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .marca-texto small {
            font-size: 10.5px;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: #D2AE9C;
        }

        .topo-direita {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .topo-direita .email {
            font-size: 12.5px;
            color: #E0C6B6;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .topo-admin .btn-fantasma {
            border-color: rgba(255, 255, 255, .3);
            color: #FFF6EA;
            padding: 8px 15px;
        }

        @media (hover:hover) {
            .topo-admin .btn-fantasma:hover {
                background: rgba(255, 255, 255, .13);
            }
        }

        @media (max-width:640px) {
            .topo-direita .email {
                display: none;
            }
        }

        /* ---------- layout ---------- */
        .layout {
            display: block;
        }

        .lateral {
            display: none;
        }

        .conteudo {
            padding: 18px 16px calc(88px + env(safe-area-inset-bottom));
            max-width: 1080px;
            margin-inline: auto;
        }

        @media (min-width:900px) {
            .layout {
                display: grid;
                grid-template-columns: 228px minmax(0, 1fr);
                align-items: start;
            }

            .lateral {
                display: grid;
                gap: 4px;
                align-content: start;
                position: sticky;
                top: 62px;
                padding: 18px 12px;
                border-right: 1px solid var(--linha);
                min-height: calc(100dvh - 62px);
            }

            .conteudo {
                padding: 26px 28px 60px;
                margin-inline: 0;
            }

            .barra-inferior {
                display: none !important;
            }
        }

        .item-menu {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 13px;
            border-radius: 11px;
            font-size: 14.5px;
            font-weight: 600;
            color: var(--tinta-2);
            text-align: left;
            transition: background-color .15s ease, color .15s ease;
        }

        .item-menu[aria-current="true"] {
            background: var(--vinho);
            color: #FFF6EA;
        }

        @media (hover:hover) {
            .item-menu:not([aria-current="true"]):hover {
                background: var(--superficie-2);
                color: var(--tinta);
            }
        }

        .barra-inferior {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 30;
            /* as colunas seguem a quantidade de itens: acrescentar uma seção no
     HTML não exige mexer neste número de novo. */
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: 1fr;
            background: var(--superficie);
            border-top: 1px solid var(--linha);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .item-barra {
            display: grid;
            justify-items: center;
            gap: 3px;
            padding: 9px 1px 10px;
            font-size: 9.5px;
            font-weight: 700;
            color: var(--tinta-3);
            line-height: 1.15;
        }

        .item-barra span {
            font-size: 16px;
        }

        .item-barra[aria-current="true"] {
            color: var(--brasa);
        }

        /* ---------- blocos de conteúdo ---------- */
        .cabeca-pagina {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .cabeca-pagina h2 {
            font-family: var(--display);
            font-size: 23px;
            font-weight: 600;
        }

        .cabeca-pagina p {
            color: var(--tinta-2);
            font-size: 13.5px;
            margin-top: 2px;
        }

        .saudacao {
            font-family: var(--display);
            font-size: clamp(22px, 5vw, 30px);
            font-weight: 600;
        }

        .saudacao+p {
            color: var(--tinta-2);
            margin-top: 4px;
            font-size: 14px;
        }

        .cartoes {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 11px;
            margin-top: 20px;
        }

        @media (min-width:760px) {
            .cartoes {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }

        .cartao-num {
            background: var(--superficie);
            border: 1px solid var(--linha);
            border-radius: var(--raio);
            padding: 15px 16px;
            box-shadow: var(--sombra-1);
        }

        .cartao-num .rotulo {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: var(--tinta-3);
        }

        .cartao-num .valor {
            margin-top: 6px;
            font-family: var(--display);
            font-size: 31px;
            font-weight: 600;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .cartao-num.destaque .valor {
            color: var(--dourado);
        }

        .cartao-num.esgotado .valor {
            color: var(--erro);
        }

        .cartao-num.disponivel .valor {
            color: var(--ok);
        }

        .atalhos {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .painel-caixa {
            background: var(--superficie);
            border: 1px solid var(--linha);
            border-radius: var(--raio);
            padding: 16px;
            box-shadow: var(--sombra-1);
            margin-top: 16px;
        }

        .painel-caixa h3 {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .dica {
            font-size: 12.5px;
            color: var(--tinta-3);
            line-height: 1.55;
        }

        /* ---------- filtros ---------- */
        .filtros {
            display: grid;
            gap: 9px;
            margin-bottom: 14px;
        }

        @media (min-width:700px) {
            .filtros {
                grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr);
            }
        }

        .busca-caixa {
            position: relative;
        }

        .busca-caixa input {
            padding-left: 38px;
        }

        .busca-caixa .lupa {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--tinta-3);
        }

        select.entrada {
            appearance: none;
            background-image: none;
        }

        /* ---------- lista de produtos ---------- */
        .lista {
            display: grid;
            gap: 10px;
        }

        .linha-produto {
            display: grid;
            grid-template-columns: 64px minmax(0, 1fr);
            gap: 13px;
            background: var(--superficie);
            border: 1px solid var(--linha);
            border-radius: var(--raio);
            padding: 12px;
            box-shadow: var(--sombra-1);
        }

        .linha-produto .foto {
            width: 64px;
            height: 64px;
            border-radius: 10px;
            overflow: hidden;
            background: var(--superficie-2);
            display: grid;
            place-items: center;
            font-size: 22px;
            color: var(--tinta-3);
        }

        .linha-produto .foto img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .linha-produto .nome {
            font-weight: 700;
            font-size: 15.5px;
            letter-spacing: -.01em;
        }

        .linha-produto .meta {
            margin-top: 3px;
            font-size: 12.5px;
            color: var(--tinta-2);
        }

        .linha-produto .meta b {
            color: var(--tinta);
            font-weight: 700;
        }

        .etiquetas {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .etiqueta {
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: .04em;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 999px;
            background: var(--superficie-2);
            color: var(--tinta-2);
        }

        .etiqueta.dourada {
            background: rgba(201, 139, 46, .15);
            color: var(--dourado);
        }

        .etiqueta.viva {
            background: var(--ok-suave);
            color: var(--ok);
        }

        .etiqueta.apagada {
            background: var(--superficie-2);
            color: var(--tinta-3);
        }

        /* ---------- domínios ---------- */
        .linha-dominio {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            background: var(--superficie);
            border: 1px solid var(--linha);
            border-radius: var(--raio);
            padding: 12px 14px;
            box-shadow: var(--sombra-1);
        }

        .linha-dominio.inativo {
            opacity: .62;
        }

        .linha-dominio .dominio-texto {
            min-width: 0;
        }

        .linha-dominio .endereco {
            font-weight: 700;
            font-size: 14.5px;
            word-break: break-all;
            line-height: 1.3;
        }

        .linha-dominio .etiquetas {
            margin-top: 6px;
        }

        .linha-dominio .espaco {
            flex: 1;
        }

        .linha-dominio .acoes {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .linha-dominio .acoes .btn {
            padding: 8px 13px;
            font-size: 13px;
        }

        @media (max-width:560px) {
            .linha-dominio .acoes {
                width: 100%;
                padding-top: 10px;
                border-top: 1px solid var(--linha);
            }

            .linha-dominio .espaco {
                display: none;
            }
        }

        .acoes-produto {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 4px;
            padding-top: 11px;
            border-top: 1px solid var(--linha);
        }

        .acoes-produto .btn {
            padding: 8px 14px;
            font-size: 13px;
        }

        .acoes-produto .espaco {
            flex: 1;
        }

        /* interruptor de disponibilidade */
        .interruptor {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 13px 7px 9px;
            border-radius: 999px;
            border: 1px solid var(--linha);
            background: var(--fundo);
            font-size: 13px;
            font-weight: 700;
            color: var(--tinta-2);
            transition: background-color .16s ease, border-color .16s ease, color .16s ease;
        }

        .interruptor .bolinha {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: var(--tinta-3);
            transition: background-color .16s ease, box-shadow .16s ease;
        }

        .interruptor.ligado {
            background: var(--ok-suave);
            border-color: transparent;
            color: var(--ok);
        }

        .interruptor.ligado .bolinha {
            background: var(--ok);
            box-shadow: 0 0 0 3px rgba(45, 122, 75, .18);
        }

        .interruptor[disabled] {
            opacity: .6;
        }

        /* ---------- categorias ---------- */
        .linha-categoria {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            background: var(--superficie);
            border: 1px solid var(--linha);
            border-radius: var(--raio);
            padding: 12px 14px;
            box-shadow: var(--sombra-1);
        }

        .linha-categoria .icone {
            font-size: 19px;
        }

        .linha-categoria .nome {
            font-weight: 700;
        }

        .linha-categoria .contagem {
            font-size: 12.5px;
            color: var(--tinta-3);
        }

        .linha-categoria .espaco {
            flex: 1;
        }

        .setas {
            display: flex;
            gap: 4px;
        }

        .seta {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            display: grid;
            place-items: center;
            border: 1px solid var(--linha);
            color: var(--tinta-2);
            font-size: 13px;
        }

        .seta[disabled] {
            opacity: .35;
        }

        .linha-categoria.inativa {
            opacity: .62;
        }

        /* ---------- esqueleto e vazio ---------- */
        @keyframes brilho {

            0%,
            100% {
                opacity: .5
            }

            50% {
                opacity: 1
            }
        }

        .esq {
            background: var(--superficie-2);
            border-radius: 8px;
            animation: brilho 1.4s ease-in-out infinite;
        }

        .esq-linha {
            height: 12px;
            margin-bottom: 8px;
        }

        .linha-produto.carregando .foto {
            animation: brilho 1.4s ease-in-out infinite;
        }

        .vazio {
            text-align: center;
            padding: 46px 20px;
            background: var(--superficie);
            border: 1px dashed var(--linha-forte);
            border-radius: var(--raio);
            color: var(--tinta-2);
        }

        .vazio .icone {
            font-size: 30px;
            opacity: .55;
        }

        .vazio strong {
            display: block;
            margin: 10px 0 5px;
            font-family: var(--display);
            font-size: 18px;
            color: var(--tinta);
        }

        .vazio .btn {
            margin-top: 16px;
        }

        /* ---------- modal / folha ---------- */
        .cortina {
            position: fixed;
            inset: 0;
            z-index: 60;
            background: rgba(26, 6, 10, .55);
            backdrop-filter: blur(2px);
            opacity: 0;
            transition: opacity .22s ease;
        }

        .cortina.aberta {
            opacity: 1;
        }

        .folha {
            position: fixed;
            z-index: 61;
            left: 0;
            right: 0;
            bottom: 0;
            max-height: 94dvh;
            display: flex;
            flex-direction: column;
            background: var(--superficie);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -10px 40px rgba(26, 6, 10, .3);
            transform: translateY(100%);
            transition: transform .3s cubic-bezier(.22, 1, .36, 1);
        }

        .folha.aberta {
            transform: translateY(0);
        }

        .folha-puxador {
            width: 40px;
            height: 4px;
            border-radius: 999px;
            background: var(--linha-forte);
            margin: 9px auto 0;
            flex: none;
        }

        .folha-cabeca {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 18px;
            flex: none;
        }

        .folha-cabeca h2 {
            font-family: var(--display);
            font-size: 19px;
            font-weight: 600;
        }

        .fechar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: var(--superficie-2);
            color: var(--tinta-2);
            font-size: 18px;
            line-height: 1;
        }

        .folha-corpo {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 0 18px 18px;
            flex: 1;
        }

        .folha-rodape {
            flex: none;
            display: flex;
            gap: 10px;
            padding: 12px 18px calc(14px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--linha);
            background: var(--superficie);
        }

        .folha-rodape .btn {
            flex: 1;
        }

        @media (min-width:760px) {
            .folha {
                left: 50%;
                top: 50%;
                bottom: auto;
                right: auto;
                width: min(620px, calc(100vw - 40px));
                max-height: min(90dvh, 820px);
                border-radius: 18px;
                transform: translate(-50%, -46%) scale(.98);
                opacity: 0;
                transition: transform .24s cubic-bezier(.22, 1, .36, 1), opacity .18s ease;
            }

            .folha.aberta {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }

            .folha-puxador {
                display: none;
            }
        }

        /* ---------- formulário ---------- */
        .duas {
            display: grid;
            gap: 12px;
        }

        @media (min-width:520px) {
            .duas {
                grid-template-columns: 1fr 1fr;
            }
        }

        .bloco-form {
            margin-top: 16px;
            padding: 14px;
            border: 1px solid var(--linha);
            border-radius: 12px;
            background: var(--fundo);
        }

        .bloco-form>h4 {
            margin: 0 0 10px;
            font-size: 11.5px;
            font-weight: 700;
            letter-spacing: .07em;
            text-transform: uppercase;
            color: var(--tinta-3);
        }

        .escolha-tipo {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 6px;
        }

        .opcao-tipo {
            padding: 12px;
            border: 1px solid var(--linha);
            border-radius: 11px;
            background: var(--superficie);
            text-align: center;
            font-size: 13.5px;
            font-weight: 600;
            color: var(--tinta-2);
        }

        .opcao-tipo.ativa {
            border-color: var(--brasa);
            background: var(--erro-suave);
            color: var(--brasa);
        }

        .opcao-tipo small {
            display: block;
            font-weight: 500;
            font-size: 11.5px;
            color: var(--tinta-3);
            margin-top: 2px;
        }

        .opcao-tipo.ativa small {
            color: var(--brasa);
            opacity: .8;
        }

        .linha-item {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 8px;
            padding: 11px;
            margin-bottom: 8px;
            border: 1px solid var(--linha);
            border-radius: 11px;
            background: var(--superficie);
        }

        .linha-item .campos {
            display: grid;
            gap: 8px;
        }

        @media (min-width:480px) {
            .linha-item .campos.tamanho {
                grid-template-columns: 1.4fr 1fr 1fr;
            }

            .linha-item .campos.opcional {
                grid-template-columns: 1.6fr 1fr;
            }
        }

        .linha-item input {
            width: 100%;
            padding: 9px 11px;
            border: 1px solid var(--linha);
            border-radius: 9px;
            background: var(--fundo);
            outline: none;
            font-size: 15px;
        }

        .linha-item input:focus {
            border-color: var(--brasa);
        }

        .linha-item .mini-rotulo {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .05em;
            text-transform: uppercase;
            color: var(--tinta-3);
            display: block;
            margin-bottom: 3px;
        }

        .remover-item {
            align-self: center;
            width: 32px;
            height: 32px;
            border-radius: 9px;
            display: grid;
            place-items: center;
            color: var(--tinta-3);
            font-size: 15px;
            border: 1px solid var(--linha);
        }

        @media (hover:hover) {
            .remover-item:hover {
                color: var(--erro);
                border-color: var(--erro);
            }
        }

        .add-item {
            width: 100%;
            padding: 10px;
            border: 1px dashed var(--linha-forte);
            border-radius: 10px;
            color: var(--brasa);
            font-weight: 700;
            font-size: 13.5px;
            background: var(--superficie);
        }

        /* foto */
        .foto-editor {
            display: flex;
            gap: 13px;
            align-items: center;
            flex-wrap: wrap;
        }

        .foto-previa {
            width: 92px;
            height: 92px;
            flex: none;
            border-radius: 12px;
            overflow: hidden;
            background: var(--superficie-2);
            display: grid;
            place-items: center;
            color: var(--tinta-3);
            font-size: 24px;
            border: 1px solid var(--linha);
        }

        .foto-previa img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .foto-acoes {
            display: grid;
            gap: 7px;
        }

        .foto-acoes .dica {
            font-size: 11.5px;
        }

        input[type="file"] {
            display: none;
        }

        .interruptor-linha {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 11px 13px;
            border: 1px solid var(--linha);
            border-radius: 11px;
            background: var(--superficie);
            margin-top: 9px;
        }

        .interruptor-linha .texto {
            font-size: 14px;
            font-weight: 600;
        }

        .interruptor-linha .texto small {
            display: block;
            font-weight: 500;
            font-size: 12px;
            color: var(--tinta-3);
        }

        .chave {
            width: 48px;
            height: 28px;
            border-radius: 999px;
            background: var(--linha);
            position: relative;
            flex: none;
            transition: background-color .18s ease;
        }

        .chave::after {
            content: "";
            position: absolute;
            top: 3px;
            left: 3px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .25);
            transition: transform .18s cubic-bezier(.22, 1, .36, 1);
        }

        .chave.ligada {
            background: var(--ok);
        }

        .chave.ligada::after {
            transform: translateX(20px);
        }

        .aviso-form {
            margin-top: 12px;
            padding: 11px 13px;
            border-radius: 10px;
            background: var(--erro-suave);
            color: var(--erro);
            font-size: 13.5px;
        }

        .aviso-info {
            margin-top: 10px;
            padding: 10px 13px;
            border-radius: 10px;
            background: var(--superficie-2);
            color: var(--tinta-2);
            font-size: 12.5px;
            line-height: 1.55;
        }

        /* ---------- entrega ---------- */
        .escolha-modo {
            display: grid;
            gap: 8px;
            margin-top: 6px;
        }

        @media (min-width:680px) {
            .escolha-modo {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        .escolha-modo .opcao-tipo {
            text-align: left;
            padding: 13px 14px;
        }

        .escolha-modo .opcao-tipo small {
            margin-top: 3px;
            line-height: 1.45;
        }

        .campo-condicional {
            margin-top: 12px;
        }

        .dica-inline {
            margin-top: 8px;
            font-size: 12.5px;
            color: var(--tinta-3);
            line-height: 1.5;
        }

        .linha-zona .nome {
            font-weight: 700;
        }

        .linha-zona .taxa {
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            color: var(--tinta-2);
        }

        .acoes-zona {
            display: flex;
            align-items: center;
            gap: 7px;
            flex-wrap: wrap;
        }

        @media (max-width:520px) {
            .linha-zona {
                align-items: flex-start;
            }

            .acoes-zona {
                width: 100%;
            }

            .acoes-zona .btn {
                flex: 1;
            }
        }

        /* ---------- horários ---------- */
        .dia-horario {
            background: var(--superficie);
            border: 1px solid var(--linha);
            border-radius: var(--raio);
            padding: 14px 15px;
            box-shadow: var(--sombra-1);
        }

        .dia-horario+.dia-horario {
            margin-top: 10px;
        }

        .dia-topo {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .dia-nome {
            font-weight: 700;
            font-size: 15.5px;
            letter-spacing: -.01em;
        }

        .dia-estado {
            font-size: 12.5px;
            color: var(--tinta-3);
            margin-top: 2px;
        }

        .dia-horario.aberto .dia-estado {
            color: var(--ok);
            font-weight: 600;
        }

        .chave-dia {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .chave-dia .rotulo {
            font-size: 12.5px;
            font-weight: 700;
            color: var(--tinta-3);
        }

        .dia-horario.aberto .chave-dia .rotulo {
            color: var(--ok);
        }

        .horas {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }

        .horas label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .05em;
            text-transform: uppercase;
            color: var(--tinta-3);
            margin-bottom: 5px;
        }

        .horas input[type="time"] {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--linha);
            border-radius: 11px;
            background: var(--fundo);
            outline: none;
            font-variant-numeric: tabular-nums;
        }

        .horas input[type="time"]:focus {
            border-color: var(--brasa);
        }

        .horas input.invalido {
            border-color: var(--erro);
            background: var(--erro-suave);
        }

        .aviso-madrugada {
            margin-top: 10px;
            font-size: 12.5px;
            color: var(--alerta);
            font-weight: 600;
        }

        .barra-salvar {
            position: sticky;
            bottom: calc(74px + env(safe-area-inset-bottom));
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 18px;
            padding: 12px;
            background: var(--superficie);
            border: 1px solid var(--linha);
            border-radius: var(--raio);
            box-shadow: var(--sombra-2);
        }

        @media (min-width:900px) {
            .barra-salvar {
                bottom: 16px;
            }
        }

        .barra-salvar .btn {
            flex: 1;
            min-width: 180px;
        }

        .selo-sujo {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--alerta);
        }

        .selo-sujo::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--alerta);
        }

        .fuso {
            margin-top: 14px;
            font-size: 12px;
            color: var(--tinta-3);
        }

        /* ---------- configurações: perfil da empresa ---------- */
        /* No celular tudo empilha; no desktop os campos relacionados
   ficam lado a lado, com a largura proporcional ao conteúdo. */
        .linha-rua,
        .linha-cidade {
            display: grid;
            gap: 12px;
        }

        @media (min-width:600px) {
            .linha-rua {
                grid-template-columns: minmax(0, 2.4fr) minmax(0, 1fr);
            }

            .linha-cidade {
                grid-template-columns: minmax(0, 2fr) minmax(0, .8fr) minmax(0, 1.2fr);
            }
        }

        .opcional {
            margin-left: 6px;
            padding: 2px 6px;
            border-radius: 5px;
            background: var(--superficie-2);
            font-size: 9.5px;
            font-weight: 700;
            letter-spacing: .04em;
            color: var(--tinta-3);
        }

        /* o @ fica dentro do campo, como no Instagram */
        .campo-arroba {
            position: relative;
        }

        .campo-arroba>span {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: 700;
            color: var(--tinta-3);
            pointer-events: none;
        }

        .campo-arroba input {
            padding-left: 32px;
        }

        .dica.contador {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .dica.contador .no-limite {
            color: var(--alerta);
            font-weight: 700;
        }

        /* ---------- identidade visual (logo e favicon) ---------- */
        .marca-area {
            display: grid;
            gap: 12px;
            align-items: start;
        }

        @media (min-width:560px) {
            .marca-area {
                grid-template-columns: 150px minmax(0, 1fr);
            }
        }

        /* o xadrez deixa a transparência visível — nada de fundo branco */
        .marca-previa {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 120px;
            padding: 10px;
            border: 1px solid var(--linha);
            border-radius: 12px;
            background-color: var(--fundo);
            background-image:
                linear-gradient(45deg, var(--superficie-2) 25%, transparent 25%),
                linear-gradient(-45deg, var(--superficie-2) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, var(--superficie-2) 75%),
                linear-gradient(-45deg, transparent 75%, var(--superficie-2) 75%);
            background-size: 14px 14px;
            background-position: 0 0, 0 7px, 7px -7px, -7px 0;
        }

        .marca-previa.sem-imagem {
            background-image: none;
            border-style: dashed;
        }

        .marca-previa img {
            max-width: 100%;
            max-height: 110px;
            object-fit: contain;
        }

        .marca-previa.favicon img {
            max-height: 64px;
        }

        .marca-vazio {
            font-size: 12.5px;
            color: var(--tinta-3);
            text-align: center;
            line-height: 1.45;
        }

        .marca-acoes {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: flex-start;
        }

        .marca-acoes .btn {
            flex: 0 0 auto;
        }

        .marca-acoes .dica {
            flex: 1 1 100%;
            margin: 0;
        }

        .marca-pendente {
            color: var(--alerta);
        }

        /* ---------- toast ---------- */
        .toast {
            position: fixed;
            left: 50%;
            top: 14px;
            z-index: 80;
            transform: translate(-50%, -16px);
            opacity: 0;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 12px 18px;
            border-radius: 999px;
            background: #23100D;
            color: #FFF3E6;
            font-size: 13.5px;
            font-weight: 600;
            box-shadow: var(--sombra-2);
            max-width: calc(100vw - 32px);
            white-space: nowrap;
            transition: opacity .2s ease, transform .2s ease;
        }

        .toast span:last-child {
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .toast.visivel {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .toast.erro {
            background: var(--erro);
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .001ms !important;
                transition-duration: .001ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- ===================== CARREGANDO ===================== -->
    <div class="tela-centro" id="tela-carregando">
        <div class="girando" aria-hidden="true"></div>
        <p>Carregando painel...</p>
    </div>

    <!-- ===================== LOGIN ===================== -->
    <main class="tela-centro" id="tela-login" hidden>
        <form class="cartao-login" id="form-login" autocomplete="on">
            <span class="selo-marca" aria-hidden="true">13</span>
            <h1>Estância Treze</h1>
            <p class="sub">Painel administrativo</p>

            <div class="campo">
                <label for="login-email">E-mail</label>
                <input id="login-email" type="email" autocomplete="username" required placeholder="voce@exemplo.com">
            </div>

            <div class="campo">
                <label for="login-senha">Senha</label>
                <div class="campo-senha">
                    <input id="login-senha" type="password" autocomplete="current-password" required
                        placeholder="Sua senha">
                    <button type="button" class="olho" id="ver-senha" aria-label="Mostrar senha">Mostrar</button>
                </div>
            </div>

            <p class="erro-login" id="erro-login" hidden></p>

            <button type="submit" class="btn btn-principal btn-bloco" id="btn-entrar">Entrar</button>
            <p class="rodape-login">Acesso restrito. Se você não tem conta, fale com o responsável pelo site.</p>
        </form>
    </main>

    <!-- ===================== PAINEL ===================== -->
    <div id="tela-painel" hidden>
        <header class="topo-admin">
            <div class="marca">
                <span class="selo-marca pequeno" aria-hidden="true">13</span>
                <div class="marca-texto">
                    <strong id="topo-empresa">—</strong>
                    <small>Painel administrativo</small>
                </div>
            </div>
            <div class="topo-direita">
                <span class="email" id="topo-email"></span>
                <button type="button" class="btn btn-fantasma" id="btn-sair">Sair</button>
            </div>
        </header>

        <div class="layout">
            <nav class="lateral" aria-label="Seções do painel">
                <button type="button" class="item-menu" data-aba="dashboard" aria-current="true"><span
                        aria-hidden="true">📊</span> Dashboard</button>
                <button type="button" class="item-menu" data-aba="produtos"><span aria-hidden="true">🍕</span>
                    Produtos</button>
                <button type="button" class="item-menu" data-aba="categorias"><span aria-hidden="true">🗂️</span>
                    Categorias</button>
                <button type="button" class="item-menu" data-aba="entrega"><span aria-hidden="true">🚚</span>
                    Entrega</button>
                <button type="button" class="item-menu" data-aba="horarios"><span aria-hidden="true">🕐</span>
                    Horários</button>
                <button type="button" class="item-menu" data-aba="dominios"><span aria-hidden="true">🌐</span>
                    Domínios</button>
                <button type="button" class="item-menu" data-aba="config"><span aria-hidden="true">⚙️</span>
                    Configurações</button>
            </nav>

            <main class="conteudo" id="conteudo"></main>
        </div>

        <nav class="barra-inferior" aria-label="Seções do painel">
            <button type="button" class="item-barra" data-aba="dashboard" aria-current="true"><span
                    aria-hidden="true">📊</span>Início</button>
            <button type="button" class="item-barra" data-aba="produtos"><span
                    aria-hidden="true">🍕</span>Produtos</button>

    <script>
        /* =====================================================================
           NÚMERO DE WHATSAPP — normalização e exibição
           ---------------------------------------------------------------------
           Arquivo compartilhado pelo site público e pelo painel administrativo,
           para que os dois concordem sobre o que é um número válido e sobre o
           formato gravado no banco.
        
           O que o banco guarda: SOMENTE DÍGITOS, com o código do país.
               (14) 99798-2903      -> 5514997982903
               +55 14 99798-2903    -> 5514997982903
        
           Como o código do país é decidido (sem ambiguidade):
               10 ou 11 dígitos  = DDD + número       -> acrescenta 55
               12 ou 13 dígitos  = já vem com o país  -> mantém como está
           Isso resolve o caso do DDD 55 (Rio Grande do Sul): "55 99798-2903"
           tem 11 dígitos, então é DDD + número e vira 5555997982903 — o 55 do
           país não é acrescentado duas vezes.
           ===================================================================== */
        window.Whats = (function () {
            "use strict";

            const soDigitos = (v) => String(v == null ? "" : v).replace(/\D/g, "");

            /* Checagem básica de número brasileiro:
               55 + DDD (11 a 99, sem terminar em 0) + assinante
               · 9 dígitos -> celular, começa com 9
               · 8 dígitos -> fixo, começa de 2 a 5                             */
            function valido(digitos) {
                if (!/^55\d{10,11}$/.test(digitos)) return false;
                const ddd = digitos.slice(2, 4);
                if (!/^[1-9][1-9]$/.test(ddd)) return false;
                const assinante = digitos.slice(4);
                if (assinante.length === 9) return /^9\d{8}$/.test(assinante);
                if (assinante.length === 8) return /^[2-5]\d{7}$/.test(assinante);
                return false;
            }

            /* Devolve { ok, numero, exibicao, motivo } — nunca lança. */
            function normalizar(valor) {
                const d = soDigitos(valor);

                if (!d) {
                    return {
                        ok: false, numero: "", exibicao: "",
                        motivo: "Informe o número de WhatsApp que vai receber os pedidos."
                    };
                }

                let numero;
                if (d.length === 10 || d.length === 11) numero = "55" + d;      // DDD + número
                else if (d.length === 12 || d.length === 13) numero = d;         // já tem o país
                else {
                    return {
                        ok: false, numero: "", exibicao: "",
                        motivo: "Número incompleto. Use DDD + número, como (14) 99798-2903."
                    };
                }

                if ((d.length === 12 || d.length === 13) && numero.slice(0, 2) !== "55") {
                    return {
                        ok: false, numero: "", exibicao: "",
                        motivo: "Por enquanto só aceitamos números do Brasil (começam com 55)."
                    };
                }
                if (!valido(numero)) {
                    return {
                        ok: false, numero: "", exibicao: "",
                        motivo: "Esse número não parece válido. Confira o DDD e os dígitos."
                    };
                }
                return { ok: true, numero: numero, exibicao: exibir(numero), motivo: "" };
            }

            /* 5514997982903 -> (14) 99798-2903 */
            function exibir(digitos) {
                const d = soDigitos(digitos);
                if (!valido(d)) return d;
                const ddd = d.slice(2, 4);
                const a = d.slice(4);
                const meio = a.length === 9 ? a.slice(0, 5) : a.slice(0, 4);
                const fim = a.length === 9 ? a.slice(5) : a.slice(4);
                return "(" + ddd + ") " + meio + "-" + fim;
            }

            return { normalizar: normalizar, exibir: exibir, valido: valido, soDigitos: soDigitos };
        })();

    </script>
    <script>
        /* =====================================================================
           PAINEL ADMINISTRATIVO — ESTÂNCIA TREZE PIZZARIA
           ---------------------------------------------------------------------
           Usa a MESMA chave publicável do site público (../supabase-config.js).

        (function () {

            const BUCKET = "product-images";

            });

            const estado = {
